<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MavR CAN Logger</title>
<style>
:root{--bg:#0f1214;--card:#1a1f23;--line:#2b3238;--text:#e8ecef;--mut:#93a0aa;--acc:#f2a33a;--ok:#3ecf7a;--bad:#ff5a52;--rec:#ff3b30;--blue:#4aa3ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b0e10;border-bottom:1px solid var(--line);padding:8px 12px}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand b{font-size:15px;letter-spacing:.5px}.brand small{color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;padding:3px 8px;border-radius:12px;background:var(--card);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.chip.ok{color:var(--ok);border-color:#23593a}.chip.bad{color:var(--bad);border-color:#6a2a26}.chip.rec{color:#fff;background:var(--rec);border-color:var(--rec)}
nav{display:flex;border-bottom:1px solid var(--line);background:#0b0e10;position:sticky;top:0}
nav button{flex:1;background:none;border:0;color:var(--mut);padding:12px 4px;font-size:15px;border-bottom:3px solid transparent}
nav button.on{color:var(--text);border-bottom-color:var(--acc)}
main{padding:12px;max-width:760px;margin:0 auto 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
h2{font-size:18px;margin:4px 0 8px}h3{font-size:15px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.step{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.step:last-child{border-bottom:0}.step .id{font-weight:700;width:52px;color:var(--acc)}.step .t{flex:1}.step .t small{display:block;color:var(--mut)}
.tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:14px}
.tick.done{background:var(--ok);border-color:var(--ok);color:#000}
.btn{display:inline-block;border:0;border-radius:10px;padding:12px 16px;font-size:16px;font-weight:600;background:#2a3238;color:var(--text);margin:4px 4px 4px 0}
.btn.pri{background:var(--acc);color:#111}.btn.ok{background:var(--ok);color:#06210f}.btn.bad{background:var(--bad);color:#fff}.btn.big{width:100%;padding:18px;font-size:20px}
.btn:disabled{opacity:.4}
.mut{color:var(--mut)}.small{font-size:13px}
.prompt{text-align:center;padding:18px 8px}
.prompt .now{font-size:30px;font-weight:800;line-height:1.15;margin:8px 0}
.prompt .now.act{color:var(--acc)}
.prompt .cd{font-size:64px;font-weight:800;color:var(--blue);font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
.next{font-size:14px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:5px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--mut);font-weight:600}
td.mono,.mono{font-family:ui-monospace,Consolas,monospace}
.byte{display:inline-block;width:20px;text-align:center;border-radius:3px}
.byte.ch{background:#5a3a08;color:#ffd08a}
textarea,input[type=text],select{width:100%;background:#0b0e10;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px}
textarea{min-height:70px}
label.row{display:block;margin:8px 0}
.cand{border-left:3px solid var(--acc);padding:6px 8px;margin:6px 0;background:#14191c;border-radius:6px}
.warn{border-left:3px solid var(--bad);padding:8px;background:#221416;border-radius:6px;margin:8px 0}
.toggle{display:flex;gap:6px}.toggle button{flex:1}
.hide{display:none!important}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.dashgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:6px 0}
.dashgrid.out{grid-template-columns:repeat(5,1fr)}.dashgrid.g{grid-template-columns:repeat(3,1fr)}
.dl{background:#0b0e10;border:1px solid var(--line);border-radius:8px;padding:8px 4px;text-align:center;font-size:20px;font-weight:700;color:#3a4148;min-height:44px}
.dl small{display:block;font-size:11px;font-weight:400;color:var(--mut);margin-bottom:2px}
.dl.on{color:#111;background:var(--acc);border-color:var(--acc)}.dl.on small{color:#333}
.dl.stale{opacity:.35}.dashgrid.g .dl{font-size:14px;color:var(--text)}
@media (max-width:600px){.dashgrid{grid-template-columns:repeat(4,1fr)}.dashgrid.out{grid-template-columns:repeat(3,1fr)}.dashgrid.g{grid-template-columns:repeat(2,1fr)}}
.padb{border:2px solid var(--line);background:#20272c;color:var(--text);border-radius:14px;padding:22px 6px;font-size:22px;touch-action:none;user-select:none;-webkit-user-select:none}
.padb small{display:block;font-size:12px;color:var(--mut);font-weight:400;margin-top:4px}
.padb.held{background:var(--acc);color:#111;border-color:var(--acc)}.padb.held small{color:#111}
.padb.unmapped{opacity:.45}.padb:disabled{cursor:not-allowed}
.btn.sm{padding:4px 8px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="brand"><b>MavR CAN Logger</b><small id="fw"></small></div>
  <div class="chips">
    <span class="chip" id="cLink">offline</span><span class="chip" id="cBaud">—</span><span class="chip" id="cRate">0 fps</span>
    <span class="chip" id="cIds">0 IDs</span><span class="chip" id="cRec">idle</span><span class="chip" id="cErr">err 0</span><span class="chip" id="cSave" style="cursor:pointer" onclick="saveChipClick()">save</span>
  </div>
</header>
<nav><button data-tab="plan" class="on">Plan</button><button data-tab="live">Live</button><button data-tab="runs">Runs</button><button data-tab="sim">Sim</button><button data-tab="setup">Setup</button></nav>
<main>
  <section id="tab-plan"></section>
  <section id="tab-step" class="hide"></section>
  <section id="tab-live" class="hide"></section>
  <section id="tab-runs" class="hide"></section>
  <section id="tab-sim" class="hide"></section>
  <section id="tab-setup" class="hide"></section>
</main>
<script>
// Capture plan for the Maverick R shifter project (matches the "Maverick R CAN Capture Plan" doc).
// Each capture step is a list of phases. Every phase start posts a marker with its label.
// mode "timed": phases advance on their own with a 3-2-1 beep before each action.
// mode "manual": you tap NEXT at each phase (for driving, with a passenger).
function pressPattern(btn, how, opts) {
  opts = opts || {};
  const reps = opts.reps || 3, hold = opts.hold || 1, rest = opts.rest || 5;
  const p = [{ label: 'baseline', text: 'Hands off. Recording the quiet bus.', dur: 10 }];
  for (let i = 1; i <= reps; i++) {
    p.push({ label: btn + ' #' + i, text: how + ' (' + hold + ' s)', dur: hold, action: true });
    p.push({ label: 'release #' + i, text: opts.back || 'Release. Hands off.', dur: rest });
  }
  if (!opts.noLong) {
    p.push({ label: btn + ' long', text: how + ' and HOLD 3 s', dur: 3, action: true });
    p.push({ label: 'release long', text: opts.back || 'Release. Hands off.', dur: 6 });
  }
  p.push({ label: 'end baseline', text: 'Hands off. Finishing.', dur: 8 });
  return p;
}

const PLAN = [
  { stage: 0, title: 'Stage 0: meter first (key off)', steps: [
    { id: 'S0', title: 'Meter the connector, override and paddles', kind: 'check',
      cond: 'Key off unless an item says key on. Multimeter and calipers.',
      checks: [
        ['conn', 'Connector ID: harness plug markings, pin pitch (mm), blade width (mm)'],
        ['gnd', 'Pinout: which pin is GND (≈0 Ω to chassis)'],
        ['canpins', 'Which pins are CAN H / CAN L (match diag pins 1/2)'],
        ['v12', '+12 V pin: battery (always on) or ignition (key on only)?'],
        ['canv', 'Key on: CAN H and CAN L to ground (≈2.5 V each)'],
        ['term', 'CAN H to CAN L resistance, key off (≈60 Ω)'],
        ['ovr', 'Override at rest: common–NC and common–NO (Ω); pressed: same'],
        ['pad', 'Paddles: signal to ground released / pulled (Ω)'],
        ['padv', 'Paddles: key on volts released / pulled'],
        ['samebus', 'Shifter CAN H/L to diag pin 1/2 continuity: same bus?'],
        ['pins', 'All 8 shifter pins: what each is (key-on volts, to ground Ω), and which are unused'],
      ] },
  ] },
  { stage: 1, title: 'Stage 1: key on, engine off', steps: [
    { id: 'S1-1', title: 'Key on wake-up', mode: 'timed', cond: 'Key OFF to start. Brake held.', why: 'Every ID, wake-up order, idle rates',
      phases: [ { label: 'key off', text: 'Key OFF. Wait.', dur: 10 }, { label: 'key ON', text: 'Turn the key ON now', dur: 60, action: true } ] },
    { id: 'S1-2', title: 'Key off / bus sleep', mode: 'timed', cond: 'Key ON, engine off.', why: 'How the bus goes to sleep',
      phases: [ { label: 'key on', text: 'Key ON. Wait.', dur: 20 }, { label: 'key OFF', text: 'Turn the key OFF now', dur: 60, action: true } ] },
    { id: 'S1-3', title: 'P button', mode: 'timed', cond: 'Key on, engine off, brake held.', why: 'P bit', phases: pressPattern('P', 'Press P') },
    { id: 'S1-4', title: 'N button', mode: 'timed', cond: 'Key on, engine off, brake held.', why: 'N bit', phases: pressPattern('N', 'Press N') },
    { id: 'S1-5', title: 'M button', mode: 'timed', cond: 'Key on, engine off, brake held.', why: 'Auto/manual request bit', phases: pressPattern('M', 'Press M') },
    { id: 'S1-6', title: 'L button', mode: 'timed', cond: 'Key on, engine off, brake held.', why: 'Low request bit', phases: pressPattern('L', 'Press L') },
    { id: 'S1-7', title: 'Lever to D', mode: 'timed', cond: 'Key on, engine off, brake held.', why: 'Lever D bit, held vs momentary',
      phases: pressPattern('lever D', 'Move the lever to D', { back: 'Let the lever return. Hands off.' }) },
    { id: 'S1-8', title: 'Lever to R', mode: 'timed', cond: 'Key on, engine off, brake held.', why: 'Lever R bit',
      phases: pressPattern('lever R', 'Move the lever to R', { back: 'Let the lever return. Hands off.' }) },
    { id: 'S1-9', title: 'Override button', mode: 'timed', cond: 'Key on, engine off, brake held.', why: 'Confirms override is not on CAN', phases: pressPattern('override', 'Press OVERRIDE') },
    { id: 'S1-10', title: 'Paddles', mode: 'timed', cond: 'Key on, engine off, brake held.', why: 'Whether paddles appear on CAN',
      phases: pressPattern('up paddle', 'Pull the UP paddle', { noLong: true }).slice(0, -1)
        .concat(pressPattern('down paddle', 'Pull the DOWN paddle', { noLong: true }).slice(1)) },
    { id: 'S1-11', title: 'Brake pedal', mode: 'timed', cond: 'Key on, engine off. Foot OFF the brake to start.', why: 'Brake signal',
      phases: pressPattern('brake', 'Press the brake', { reps: 5, hold: 2, rest: 3, noLong: true, back: 'Release the brake.' }) },
    { id: 'S1-12', title: 'Throttle sweep', mode: 'timed', cond: 'Key on, ENGINE OFF.', why: 'Throttle position',
      phases: [ { label: 'baseline', text: 'Hands and feet off.', dur: 8 },
        { label: 'throttle up #1', text: 'Slowly press throttle to the floor (4 s)', dur: 4, action: true }, { label: 'throttle down #1', text: 'Slowly release (4 s)', dur: 5 },
        { label: 'throttle up #2', text: 'Slowly press throttle to the floor (4 s)', dur: 4, action: true }, { label: 'throttle down #2', text: 'Slowly release (4 s)', dur: 5 },
        { label: 'throttle up #3', text: 'Slowly press throttle to the floor (4 s)', dur: 4, action: true }, { label: 'throttle down #3', text: 'Slowly release (4 s)', dur: 5 },
        { label: 'end baseline', text: 'Feet off. Finishing.', dur: 6 } ] },
    { id: 'S1-13', title: 'Shifter unplugged', mode: 'timed', cond: 'Key on, engine off, brake held. Hand on the shifter plug.', why: 'Shifter IDs, fault timing',
      phases: [ { label: 'baseline', text: 'Hands off.', dur: 10 }, { label: 'UNPLUG shifter', text: 'UNPLUG the shifter now. Watch the dash.', dur: 30, action: true },
        { label: 'PLUG shifter', text: 'PLUG the shifter back in now', dur: 20, action: true } ],
      after: 'Key off for 30 s afterwards and note any fault that stays.' },
  ] },
  { stage: 2, title: 'Stage 2: engine running, parked', steps: [
    { id: 'S2-0', title: 'Engine start and stop', mode: 'timed', cond: 'Key on, engine off, Park, brake held.', why: 'Crank/run status, start inhibit, frames that only exist running',
      phases: [ { label: 'key on', text: 'Key on, engine off. Hands off.', dur: 10 }, { label: 'START engine', text: 'START the engine now', dur: 20, action: true },
        { label: 'idle', text: 'Idle. Hands off.', dur: 10 }, { label: 'engine OFF', text: 'Turn the engine OFF now (key stays on if it can)', dur: 15, action: true } ] },
    { id: 'S2-1', title: 'Idle', mode: 'timed', cond: 'Engine running, Park, brake held, chocks in.', why: 'RPM and running frames',
      phases: [ { label: 'idle', text: 'Idle. Hands off.', dur: 60 } ] },
    { id: 'S2-2', title: 'RPM steps', mode: 'timed', cond: 'Park, brake held. Watch the tach.', why: 'RPM scaling',
      phases: [ { label: 'idle', text: 'Idle', dur: 8 }, { label: 'rpm 2000', text: 'Hold 2,000 RPM', dur: 5, action: true }, { label: 'idle', text: 'Back to idle', dur: 5 },
        { label: 'rpm 3000', text: 'Hold 3,000 RPM', dur: 5, action: true }, { label: 'idle', text: 'Back to idle', dur: 5 },
        { label: 'rpm 4000', text: 'Hold 4,000 RPM', dur: 5, action: true }, { label: 'idle', text: 'Back to idle', dur: 8 } ] },
    { id: 'S2-3', title: 'P-N-D-N-R-N-P', mode: 'timed', cond: 'Brake held hard, chocks in.', why: 'Requested vs actual gear',
      phases: [ { label: 'P', text: 'In Park', dur: 6 }, { label: 'to N', text: 'Select N', dur: 5, action: true }, { label: 'to D', text: 'Select D', dur: 5, action: true },
        { label: 'to N', text: 'Select N', dur: 5, action: true }, { label: 'to R', text: 'Select R', dur: 5, action: true }, { label: 'to N', text: 'Select N', dur: 5, action: true },
        { label: 'to P', text: 'Select P', dur: 6, action: true } ] },
    { id: 'S2-4', title: 'D and R without brake', mode: 'manual', cond: 'Chocks in. Foot near the brake.', why: 'Refused-request pattern',
      phases: [ { label: 'P', text: 'In Park, foot OFF brake' }, { label: 'try D', text: 'Try to select D (no brake)', action: true },
        { label: 'try R', text: 'Try to select R (no brake)', action: true }, { label: 'brake on P', text: 'Brake on, back to Park' } ] },
    { id: 'S2-5', title: 'M in Drive', mode: 'timed', cond: 'In D, brake held.', why: 'Auto/manual state',
      phases: [ { label: 'D auto', text: 'In D (auto)', dur: 6 }, { label: 'M on', text: 'Press M (manual)', dur: 6, action: true },
        { label: 'M off', text: 'Press M again (auto)', dur: 6, action: true }, { label: 'end', text: 'Hands off', dur: 5 } ] },
    { id: 'S2-6', title: 'Manual: up paddle at a stop', mode: 'timed', cond: 'Manual, 1st, stopped, brake held.', why: 'Refused 2nd from a stop',
      phases: pressPattern('up paddle', 'Pull the UP paddle', { noLong: true }) },
    { id: 'S2-7', title: 'Auto: up paddle at a stop', mode: 'timed', cond: 'Auto, D, stopped, brake held.', why: 'Refusal in auto; manual latch?',
      phases: pressPattern('up paddle', 'Pull the UP paddle', { noLong: true }) },
    { id: 'S2-8', title: 'Low range', mode: 'timed', cond: 'In D, stopped, brake held.', why: 'Range request vs actual',
      phases: [ { label: 'D high', text: 'In D, High range', dur: 6 }, { label: 'L on', text: 'Press L', dur: 8, action: true },
        { label: 'L off', text: 'Press L again (back to High)', dur: 8, action: true }, { label: 'end', text: 'Hands off', dur: 5 } ] },
    { id: 'S2-9', title: 'Override in R', mode: 'timed', cond: 'In R, brake held, chocks in.', why: 'Override effect',
      phases: [ { label: 'R', text: 'In R, light throttle', dur: 6 }, { label: 'override held', text: 'HOLD override, light throttle', dur: 5, action: true },
        { label: 'override released', text: 'Release override', dur: 6 } ] },
    { id: 'S2-11', title: 'Direct changes at a stop', mode: 'timed', cond: 'Brake held hard, chocks in, engine running.', why: 'D→P, R→P and D↔R without N: what the shifter sends and what the ECU accepts',
      phases: [ { label: 'P', text: 'In Park', dur: 6 }, { label: 'to D', text: 'Lever to D', dur: 5, action: true }, { label: 'D to P', text: 'Press P (straight from D)', dur: 5, action: true },
        { label: 'to R', text: 'Lever to R', dur: 5, action: true }, { label: 'R to P', text: 'Press P (straight from R)', dur: 5, action: true },
        { label: 'to D', text: 'Lever to D', dur: 5, action: true }, { label: 'D to R', text: 'Lever to R (straight from D)', dur: 5, action: true },
        { label: 'R to D', text: 'Lever to D (straight from R)', dur: 5, action: true }, { label: 'to P', text: 'Press P', dur: 6, action: true } ] },
    { id: 'S2-10', title: 'Shifter unplugged, running', mode: 'timed', cond: 'Park, brake held, engine running.', why: 'Fallback and timeout',
      phases: [ { label: 'baseline', text: 'Park, hands off', dur: 8 }, { label: 'UNPLUG shifter', text: 'UNPLUG the shifter now', dur: 20, action: true },
        { label: 'PLUG shifter', text: 'PLUG it back in now', dur: 15, action: true } ] },
  ] },
  { stage: 3, title: 'Stage 3: moving (passenger runs the phone)', steps: [
    { id: 'S3-1', title: 'Steady speeds', mode: 'manual', cond: 'Flat lot. Passenger taps NEXT.', why: 'Speed signal',
      phases: [ { label: 'stopped', text: 'Stopped in D' }, { label: '5 mph', text: 'Hold 5 mph (10 s), then NEXT', action: true },
        { label: '10 mph', text: 'Hold 10 mph (10 s), then NEXT', action: true }, { label: '20 mph', text: 'Hold 20 mph (10 s), then NEXT', action: true }, { label: 'stop', text: 'Slow to a stop' } ] },
    { id: 'S3-2', title: 'Auto accel and coast', mode: 'manual', cond: 'Auto, D.', why: 'Actual gear in auto',
      phases: [ { label: 'go', text: 'Accelerate gently to 25 mph', action: true }, { label: 'coast', text: 'Coast to a stop', action: true }, { label: 'stopped', text: 'Stopped' } ] },
    { id: 'S3-3', title: 'Manual up and down', mode: 'manual', cond: 'Manual mode.', why: 'Paddle requests vs actual gear',
      phases: [ { label: '1st', text: 'Pull away in 1st' }, { label: 'up 2', text: 'Shift up to 2nd', action: true }, { label: 'up 3', text: 'Shift up to 3rd', action: true },
        { label: 'down 2', text: 'Shift down to 2nd', action: true }, { label: 'down 1', text: 'Shift down to 1st', action: true }, { label: 'stop', text: 'Stop' } ] },
    { id: 'S3-4', title: 'Paddle in auto', mode: 'manual', cond: 'Auto, moving steady.', why: 'Temporary manual and revert time',
      phases: [ { label: 'steady', text: 'Steady speed in auto' }, { label: 'up paddle', text: 'Pull UP paddle once', action: true },
        { label: 'reverted?', text: 'Tap NEXT when the dash goes back to auto (or after 15 s)', action: true } ] },
    { id: 'S3-5', title: 'L while rolling', mode: 'manual', cond: 'Rolling about 5 mph in D.', why: 'Low refused while moving?',
      phases: [ { label: 'rolling', text: 'Rolling about 5 mph' }, { label: 'L', text: 'Press L', action: true }, { label: 'stop', text: 'Stop' } ] },
    { id: 'S3-6', title: 'P while rolling', mode: 'manual', cond: 'Rolling SLOWLY in D.', why: 'Park refused while moving',
      phases: [ { label: 'rolling', text: 'Rolling slowly' }, { label: 'P', text: 'Press P', action: true }, { label: 'stop', text: 'Stop with the brake' } ] },
    { id: 'S3-7', title: 'N while rolling', mode: 'manual', cond: 'Flat ground, rolling SLOWLY (about 3 mph) in D.', why: 'Is Neutral accepted while moving?',
      phases: [ { label: 'rolling', text: 'Rolling slowly in D' }, { label: 'N', text: 'Press N', action: true }, { label: 'back to D', text: 'Lever to D', action: true }, { label: 'stop', text: 'Stop with the brake' } ] },
    { id: 'S3-8', title: 'Lever D while moving', mode: 'manual', cond: 'Auto, D, steady about 10 mph.', why: 'What a lever pull does in motion (downshift? manual?)',
      phases: [ { label: 'steady', text: 'Steady speed in auto' }, { label: 'lever D #1', text: 'Pull the lever to D once', action: true },
        { label: 'lever D #2', text: 'Pull the lever to D again', action: true }, { label: 'stop', text: 'Slow to a stop' } ] },
    { id: 'S3-9', title: 'Free drive', mode: 'manual', cond: 'Normal driving, about 5 minutes. Passenger presses Mark now for anything notable.', why: 'Lots of mixed data: counters, checksums, gear, speed, RPM together',
      phases: [ { label: 'drive', text: 'Drive normally: stops, starts, a few lever pulls and paddle shifts, one reverse. NEXT when done.' }, { label: 'parked', text: 'Stop and select Park' } ] },
  ] },
  { stage: 4, title: 'Stage 4: factory protections (on stands)', steps: [
    { id: 'S4-1', title: 'R while wheels turn', mode: 'manual', cond: 'On stands, nobody near the wheels.', why: 'Refused R at speed',
      phases: [ { label: 'D turning', text: 'Wheels turning slowly in D' }, { label: 'lever R', text: 'Lever to R', action: true }, { label: 'stop', text: 'Brake to a stop' } ] },
    { id: 'S4-2', title: 'R threshold', mode: 'manual', cond: 'On stands.', why: 'Speed threshold for R',
      phases: [ { label: 'try 1', text: 'Slower: lever to R. Note the speed', action: true }, { label: 'try 2', text: 'Slower again: lever to R', action: true },
        { label: 'try 3', text: 'Slower again: lever to R', action: true }, { label: 'stop', text: 'Stop' } ] },
    { id: 'S4-3', title: 'D while reversing', mode: 'manual', cond: 'On stands.', why: 'Refused D in reverse',
      phases: [ { label: 'R turning', text: 'Wheels turning slowly in R' }, { label: 'lever D', text: 'Lever to D', action: true }, { label: 'stop', text: 'Stop' } ] },
  ] },
];

</script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const API = '';               // same origin (http://192.168.4.1)
const store = {
  get(k, d) { try { const v = localStorage.getItem('mavr.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mavr.' + k, JSON.stringify(v)); } catch (e) {} }
};

function summaryCsv() {

function parseSavvy(txt) {
  const out = [];

}

// ---------------- run engine
function beep(f, ms) {
  try {
    const ac = beep.ac || (beep.ac = new (window.AudioContext || window.webkitAudioContext)());
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = f; o.connect(g); g.connect(ac.destination);
    g.gain.value = 0.25; o.start(); o.stop(ac.currentTime + ms / 1000);
  } catch (e) {}
}
function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function mark(label) {
  try { const r = await api('/api/mark', 'POST', { label }); if (runner) runner.marks.push([r.t, label]); return r; }
  catch (e) { if (runner) runner.missed.push(label); }
}

async function startRun(s, mode) {
  if (USB && !LL.port && !(await usbConnect())) return;
  if (!status || !status.kbps) { if (!confirm('No bit rate set yet. Record anyway at 500 kbps?')) return; }
  const prev = progress[s.id];
  if (FS.supported && !FS.ok()) {
    if (confirm('Auto-save is off, so this run would only be kept in the page.\n\nOK = ' + (FS.dir ? 'resume saving to ' + FS.dir.name : 'choose the save folder') + ' now\nCancel = record without auto-save')) { if (FS.dir) await FS.resume(); else await FS.choose(); }
  }
  if (prev && prev.at && !confirm(prev.saved ? 'Redo ' + s.id + '? The new recording replaces the saved ' + s.id + ' data and files (attempt ' + ((prev.attempts || 1) + 1) + ').' : 'The last ' + s.id + ' run was not saved. Overwrite it?')) return;
  beep(660, 60);   // unlocks audio on iOS
  try { await api('/api/start', 'POST', { run: s.id }); } catch (e) { alert('Could not start: ' + e.message); return; }
  runner = { step: s, mode, marks: [], missed: [], abort: false, next: null, i: 0 };
  renderRunner();
  startCheckpoints(s);
  await mark('START ' + s.id);
  for (let i = 0; i < s.phases.length && !runner.abort; i++) {
    runner.i = i;
    const ph = s.phases[i];
    if (mode === 'timed') {
      if (ph.action) {                         // 3-2-1 lead-in so the action lands on the marker
        for (let c = 3; c > 0 && !runner.abort; c--) { showPrompt(ph, 'get ready', c, true); beep(880, 80); await sleep(1000); }
      }
      if (runner.abort) break;
      beep(ph.action ? 1320 : 520, ph.action ? 250 : 80); if (ph.action) buzz(200);
      await mark(ph.label);
      const t0 = performance.now(), dur = (ph.dur || 5) * 1000;
      while (!runner.abort) {
        const left = dur - (performance.now() - t0);
        if (left <= 0) break;
        showPrompt(ph, null, Math.ceil(left / 1000), false, 1 - left / dur);
        await sleep(100);
      }
    } else {
      showPrompt(ph, 'tap NEXT when done', null, false);
      if (i === 0) await mark(ph.label);
      await new Promise(res => runner.next = res);
      if (runner.abort) break;
      beep(1320, 120); buzz(100);
      if (i + 1 < s.phases.length) await mark(s.phases[i + 1].label);
    }
  }
  await mark(runner.abort ? 'ABORTED' : 'END');
  await sleep(300);
  try { await api('/api/stop', 'POST'); } catch (e) {}
  beep(440, 300);
  const r = runner; runner = null;
  await finishRun(r);
}

// ---------------- download, parse, analyse
async function fetchRun() {
  const [bin, marks] = await Promise.all([api('/api/run.bin'), api('/api/markers')]);
  return { frames: parseBin(bin), marks };
}
function parseBin(buf) {
  const dv = new DataView(buf), n = Math.floor(buf.byteLength / 20), f = new Array(n);
  for (let i = 0; i < n; i++) {
    const o = i * 20, d = new Uint8Array(buf, o + 9, 8);
    f[i] = { t: dv.getUint32(o, true), id: dv.getUint32(o + 4, true), dlc: dv.getUint8(o + 8), d: Array.from(d) };
  }
  return f;
}

function analyse(frames, marks, actLabels) {
  const byId = new Map();
  for (const f of frames) { let a = byId.get(f.id); if (!a) byId.set(f.id, a = []); a.push(f); }
  const al = new Set(actLabels || []);
  const acts = marks.filter(m => al.has(m[1]));
  const win = (t) => acts.some(m => t >= m[0] - 300000 && t <= m[0] + 2500000);
  const ids = [], cands = [], vanish = [];
  const end = frames.length ? frames[frames.length - 1].t : 0;
  for (const [id, a] of byId) {
    const n = a.length, period = n > 1 ? (a[n - 1].t - a[0].t) / (n - 1) : 0;
    const info = { id, n, hz: period ? 1e6 / period : 0, counters: [], fast: [] };
    ids.push(info);
    // gaps (shifter unplug): any silence longer than 5 periods and 300 ms
    if (n > 5) for (let i = 1; i < n; i++) { const g = a[i].t - a[i - 1].t; if (g > Math.max(5 * period, 300000)) vanish.push({ id, from: a[i - 1].t, to: a[i].t }); }
    if (n > 5 && a[n - 1].t < end - Math.max(5 * period, 1000000)) vanish.push({ id, from: a[n - 1].t, to: null });
    for (let b = 0; b < 8; b++) {
      // byte-level: counter detection
      let inc = 0, chg = 0;
      for (let i = 1; i < n; i++) { const x = a[i].d[b], y = a[i - 1].d[b]; if (x !== y) { chg++; const dd = (x - y) & 0xFF, dn = (x - y) & 0x0F; if (dd === 1 || dd === 0x10 || (dn === 1 && (x >> 4) === (y >> 4))) inc++; } }
      if (n > 10 && chg > 0.8 * (n - 1)) { (inc > 0.8 * chg ? info.counters : info.fast).push(b); continue; }
      for (let bit = 0; bit < 8; bit++) {
        const m = 1 << bit; const flips = [];
        for (let i = 1; i < n; i++) if ((a[i].d[b] ^ a[i - 1].d[b]) & m) flips.push(a[i].t);
        if (!flips.length || flips.length > 0.3 * n) continue;
        const inWin = flips.filter(win).length, out = flips.length - inWin;
        const hit = acts.filter(mk => flips.some(t => t >= mk[0] - 300000 && t <= mk[0] + 2500000)).length;
        const score = acts.length ? (hit / acts.length) * (inWin / flips.length) : 0;
        cands.push({ id, byte: b, bit, flips: flips.length, inWin, out, hit, acts: acts.length, score, first: flips[0] });
      }
    }
  }
  cands.sort((x, y) => y.score - x.score || x.out - y.out);
  ids.sort((x, y) => (x.id & 0x1FFFFFFF) - (y.id & 0x1FFFFFFF));
  return { ids, cands: cands.slice(0, 40), vanish: vanish.slice(0, 30), acts: acts.length, frames: frames.length, dur: end / 1e6 };
}

function csvSavvy(frames) {
  const L = ['Time Stamp,ID,Extended,Dir,Bus,LEN,D1,D2,D3,D4,D5,D6,D7,D8'];
  for (const f of frames) {
    const ext = !!(f.id & 0x80000000), v = f.id & 0x1FFFFFFF;
    const d = []; for (let i = 0; i < 8; i++) d.push(i < f.dlc ? hex(f.d[i], 2) : '');
    L.push(f.t + ',0x' + hex(v, 8) + ',' + ext + ',' + (f.id & 0x20000000 ? 'Tx' : 'Rx') + ',0,' + f.dlc + ',' + d.join(','));
  }

}

const SIM = {

  ready() {

    if (!simAllowed) r.push('Sending is not allowed yet (switch above).');
    if (!simProfile.frames.some(f => f.on)) r.push('No frame to send yet: do step 2 below (learn 0x345 from the bus).');

  },
  conflict(id) { if (this.armed) this.stop('0x' + idStr(id) + ' appeared from another node while sending. Is the factory shifter plugged in?'); },

let simListen = null;   // {left} while learning from the bus
async function simLearnLive() {
  if (!LL.port || !LL.on) { alert('Connect the adapter and set the bit rate first.'); return; }

  const now = performance.now();

    ${simListen ? `<b>listening… <span id="simLiveLeft">${simListen.left}</span> s</b>` : `<button class="btn" id="simLiveBtn" ${LL.port && LL.on && !SIM.armed ? '' : 'disabled'}>Re-learn 0x345 from the bus (10 s)</button>`}
    ${simLastLearn ? `<div class="cand mono small" style="white-space:pre-line">${esc(simLastLearn)}</div>` : ''}
    <p class="small mut">Learn copies a frame from a capture: its period, normal data, rolling counter and checksum (found by testing the common checksum types against every frame). Edit anything after.</p>
    <table><tr><th>on</th><th>ID</th><th>ms</th><th>DLC</th><th>data (hex)</th><th>counter</th><th>checksum</th><th></th></tr>` +
    P.frames.map((f, i) => `<tr><td><input type="checkbox" data-fo="${i}" ${f.on ? 'checked' : ''}></td><td class="mono">0x${idStr(fullId(f))}</td>
      <td><input type="text" data-fp="${i}" value="${f.period}" style="width:60px"></td><td>${f.dlc}</td>
      <td><input type="text" data-fd="${i}" class="mono" value="${f.data.slice(0, f.dlc).map(b => hex(b, 2)).join(' ')}"></td>
      <td class="small mono">${f.counter ? 'byte ' + f.counter.byte + ' &' + hex(f.counter.mask, 2) : 'none'}</td><td class="small mono">${esc(ckName(f.checksum))}</td>
      <td><button class="btn bad" style="padding:4px 8px;font-size:13px" data-fx="${i}" ${SIM.armed ? 'disabled' : ''}>✕</button></td></tr>`).join('') + '</table>';
  h += `<h3>Or learn a frame from a saved capture</h3>
    <select id="simSrc"><option value="">choose a run…</option>${lastRun ? `<option value="__last">Last run in this page (${esc(lastRun.stepId)})</option>` : ''}${runs.map(s => `<option value="${s.id}">${s.id} ${esc(s.title)} (saved)</option>`).join('')}</select>
    ${simLearn ? `<select id="simId">${simLearn.ids.map(x => `<option value="${x.id}">0x${idStr(x.id)} · ${x.hz.toFixed(0)} Hz · ${x.n} frames</option>`).join('')}</select><button class="btn pri" id="simLearnGo" ${SIM.armed ? 'disabled' : ''}>Learn this frame</button>` : ''}
    <p class="small mut">The shifter's own frames are the IDs that went silent in S1-13 (shifter unplugged).</p></div>`;
  // profile: buttons
  h += `<div><h2>Button map</h2><p class="small mut">Filled by "→ Sim" on a test's results, or typed: <span class="mono">2F0:1.0=1</span> = ID 2F0, byte 1, bit 0 set to 1 while held. <span class="mono">2F0:3&0F=05</span> = byte 3, mask 0F, value 05. Several are separated by spaces.</p><table>` +
    SIM_BTNS.map(([k, label]) => { const bad = parseEdits(P.buttons[k]).filter(x => x.bad); return `<tr><td><b>${esc(label)}</b></td><td><input type="text" class="mono" data-bm="${k}" value="${esc(P.buttons[k] || '')}">${bad.length ? '<div class="small" style="color:var(--bad)">Not understood: ' + bad.map(x => esc(x.bad)).join(' ') + '</div>' : ''}</td></tr>`; }).join('') +
    `</table><button class="btn" id="simExp">⬇ Export profile</button><label class="btn">⬆ Import<input type="file" id="simImp" accept=".json" class="hide"></label>
    <p class="small mut">${FS.ok() ? 'Auto-saved to ' + esc(FS.dir.name) + '\\shifter_sim_profile.json. This is also the starting data for the backup board firmware.' : 'Saved in this browser. Choose a save folder to keep it with the captures.'}</p></div>
    <button class="btn" id="simReset">Reset to the built-in Maverick R profile</button></details>`;
  $('#tab-sim').innerHTML = h;
  $('#simReset').onclick = () => { if (confirm('Replace the frames and button map with the built-in Maverick R values?')) { simProfile.frames = [JSON.parse(JSON.stringify(MAVR_FRAME))]; simProfile.buttons = Object.assign({}, MAVR_BUTTONS); simSave(); renderSim(); } };
  // bindings
  const al = $('#simAllow'); if (al) al.onchange = () => { if (al.checked && !confirm('Allow this page to transmit on the vehicle CAN bus?\n\nNothing is sent until you press Start simulator, and the checks run again then.')) al.checked = false; simAllowed = al.checked; renderSim(); };
  const ar = $('#simArm'); if (ar) ar.onclick = () => SIM.arm();
  const sp = $('#simStop'); if (sp) sp.onclick = () => SIM.stop('STOP pressed');
  const rc = $('#simRec'); if (rc) rc.onclick = () => simRecToggle().catch(e => alert(e.message));
  document.querySelectorAll('[data-sb]').forEach(b => {
    const k = b.dataset.sb;
    b.onpointerdown = e => { e.preventDefault(); b.setPointerCapture(e.pointerId); SIM.press(k); };
    b.onpointerup = b.onpointercancel = b.onlostpointercapture = () => SIM.release(k);
    b.oncontextmenu = e => e.preventDefault();
  });
  $('#simW').oninput = () => { simWatch = $('#simW').value; store.set('simWatch', simWatch); };
  document.querySelectorAll('[data-fo]').forEach(c => c.onchange = () => { P.frames[+c.dataset.fo].on = c.checked; simSave(); });
  document.querySelectorAll('[data-fp]').forEach(c => c.onchange = () => { const v = Math.max(5, parseInt(c.value) || 100); P.frames[+c.dataset.fp].period = v; c.value = v; simSave(); });
  document.querySelectorAll('[data-fd]').forEach(c => c.onchange = () => { const f = P.frames[+c.dataset.fd], b = c.value.replace(/[^0-9a-f]/gi, '').match(/../g) || []; for (let i = 0; i < 8; i++) f.data[i] = i < b.length ? parseInt(b[i], 16) : f.data[i]; simSave(); renderSim(); });
  document.querySelectorAll('[data-fx]').forEach(c => c.onclick = () => { if (confirm('Remove this frame from the simulator?')) { P.frames.splice(+c.dataset.fx, 1); simSave(); renderSim(); } });
  document.querySelectorAll('[data-bm]').forEach(c => c.onchange = () => { P.buttons[c.dataset.bm] = c.value.trim(); simSave(); renderSim(); });
  const lb = $('#simLiveBtn'); if (lb) lb.onclick = () => simLearnLive().catch(e => { simListen = null; renderSim(); alert(e.message); });
  $('#simSrc').onchange = async () => {
    const v = $('#simSrc').value; simLearn = null;
    if (v === '__last' && lastRun) simLearn = { frames: lastRun.frames, src: lastRun.stepId };
    else if (v) { const p = progress[v]; const t = await FS.read(p.files[0]); if (!t) { alert('Could not read ' + p.files[0]); return; } simLearn = { frames: parseSavvy(t), src: v }; }
    if (simLearn) { const a = analyse(simLearn.frames, [], []); simLearn.ids = a.ids.filter(x => !(x.id & 0x20000000)); }
    renderSim(); if (v) $('#simSrc').value = v;
  };
  const lg = $('#simLearnGo'); if (lg) lg.onclick = () => simLearnApply(+$('#simId').value >>> 0, false);
  $('#simExp').onclick = () => download('shifter_sim_profile.json', JSON.stringify(P, null, 1), 'application/json');
  $('#simImp').onchange = async e => { const f = e.target.files[0]; if (!f) return; try { const j = JSON.parse(await f.text()); if (!Array.isArray(j.frames)) throw new Error('not a profile'); simProfile = j; simSave(); renderSim(); } catch (x) { alert('Import failed: ' + x.message); } };
  simLive();
  clearInterval(simUiTimer); simUiTimer = setInterval(() => { if (curTab !== 'sim') { clearInterval(simUiTimer); return; } if (!SIM.armed) simLive(); }, 250);
}

// ---------------- setup
function renderSetup() {
  const bitCard = `<div class="card"><h2>Bit rate</h2>
    <p class="small mut">Key ON so the bus is awake. Auto tries 500, 250, 1000 and 125 kbps in listen-only mode. A wrong rate can't disturb the car.</p>
    <button class="btn pri" id="auto">Find bit rate</button>
    <select id="kb"><option value="500">500 kbps</option><option value="250">250 kbps</option><option value="1000">1 Mbps</option><option value="125">125 kbps</option></select>
    <button class="btn" id="setk">Set manually</button><p id="kres" class="small"></p></div>`;
  if (USB) {
    $('#tab-setup').innerHTML = `<div class="card"><h2>USB CAN adapter</h2>
    <p class="small">${LL.port ? '✓ Connected · ' + esc(LL.info) + (LL.ver ? ' · fw ' + esc(LL.ver) : '') + (LL.on ? ' · listen-only at ' + LL.kbps + ' kbps' : ' · <b>bus closed</b>') : 'Not connected.'}</p>
    ${linkOk() ? '' : '<div class="warn">This browser cannot reach USB devices this way. Use Chrome' + (IS_ANDROID ? '' : ' or Edge') + ', or switch the connection type below.</div>'}
    <p class="small">Connection type: <select id="linkSel" style="width:auto;padding:4px"><option value="serial" ${LINK === 'serial' ? 'selected' : ''}>Serial port (PC)</option><option value="usb" ${LINK === 'usb' ? 'selected' : ''}>Direct USB (Android)</option></select></p>
    <button class="btn pri" id="ucon">${LL.port ? 'Reconnect / pick another' : 'Connect adapter'}</button>${LL.port ? '<button class="btn" id="udis">Disconnect</button>' : ''}
    <p class="small mut">Pick the adapter's COM port (it shows as "USB Serial Device"). The app sends C, S6 (500k), M1 (listen-only) then O. Close SavvyCAN or any serial monitor first: only one program can hold the port.</p></div>
    ${bitCard}
    <div class="card"><h2>Auto-save folder</h2>
    <p class="small">${FS.ok() ? '✓ Auto-saving to <b>' + esc(FS.dir.name) + '</b>' + (FS.lastSave ? ' · last write ' + FS.lastSave.toLocaleTimeString() : '') : FS.dir ? 'Paused: Chrome needs a click to keep writing to <b>' + esc(FS.dir.name) + '</b>.' : 'Off. Files only download when you click Save.'}</p>
    ${FS.supported ? (FS.dir && !FS.ok() ? '<button class="btn pri" id="sres">Resume saving</button>' : '') + '<button class="btn ' + (FS.dir ? '' : 'pri') + '" id="sdir">' + (FS.dir ? 'Change folder' : 'Choose folder (e.g. CAN Captures)') + '</button>' + (FS.dir ? '<button class="btn" id="ndir">Stop auto-save</button>' : '') : ''}
    <p class="small mut">Use one folder per capture session. Each test writes <span class="mono">&lt;id&gt;_&lt;name&gt;.csv</span> and <span class="mono">_markers.csv</span>; a redo overwrites them. session.json and Session_Summary.csv update on every change. While recording, a checkpoint goes to _recovery every 10 s. Opening a folder that already has a session.json picks that session up where it left off.</p></div>
    <div class="card"><h2>Hook-up</h2><table>
    <tr><th>Adapter</th><th>Connect to</th></tr>
    <tr><td>CAN H</td><td>Vehicle CAN H (back-probe)</td></tr><tr><td>CAN L</td><td>Vehicle CAN L</td></tr>
    <tr><td>GND</td><td>Vehicle ground (on the isolated RH02 Pro this is the isolated CAN ground)</td></tr></table>
    <div class="warn">Termination jumper/switch OFF. The car's bus is already terminated.</div>
    <ul class="small"><li>A laptop on battery is best: no charger ground loop to the vehicle.</li>
    <li>Keep this tab in front during runs. Recording continues in the background, but the beeps need the tab.</li>
    <li>Frame times are stamped when the PC receives them (about ±1–2 ms). Markers use the same clock.</li></ul></div>`;
    $('#ucon').onclick = async () => { await usbConnect(); renderSetup(); };
    $('#linkSel').onchange = async () => { if (LL.port) await LL.disconnect(); setLink($('#linkSel').value); pollStatus(); renderSetup(); };
    const ud = $('#udis'); if (ud) ud.onclick = async () => { await LL.disconnect(); pollStatus(); renderSetup(); };
    const sd = $('#sdir'); if (sd) sd.onclick = async () => { await FS.choose(); renderSetup(); };
    const sr = $('#sres'); if (sr) sr.onclick = async () => { await FS.resume(); renderSetup(); };
    const nd = $('#ndir'); if (nd) nd.onclick = async () => { if (confirm('Stop auto-saving to ' + FS.dir.name + '? Files already there stay.')) { await FS.forget(); renderSetup(); } };
  } else {
    $('#tab-setup').innerHTML = bitCard + `<div class="card"><h2>Wiring</h2><table>
    <tr><th>SN65HVD230</th><th>Connect to</th></tr>
    <tr><td>3V3</td><td>XIAO 3V3</td></tr><tr><td>GND</td><td>XIAO GND and vehicle CAN ground</td></tr>
    <tr><td>CRX (R)</td><td>XIAO D3 (GPIO4)</td></tr><tr><td>CTX (D)</td><td><b>3V3</b>: transmitter held off</td></tr>
    <tr><td>CANH / CANL</td><td>Vehicle CAN H / CAN L (back-probe)</td></tr></table>
    <div class="warn">Remove the breakout's 120 Ω terminator. The car's bus is already terminated.</div></div>
    <div class="card"><h2>Tips</h2><ul class="small">
    <li>Set the phone's screen timeout to 10 min so it stays awake during runs.</li>
    <li>Turn the volume up: a high beep means "do it now".</li>
    <li>Save files after every run. The logger keeps only the most recent run.</li>
    <li>Wi-Fi: MavR-CAN · password shifter26 · http://192.168.4.1</li></ul></div>`;
  }
  $('#kb').value = String(USB ? LL.kbps : (status && status.kbps) || 500);
  $('#auto').onclick = async () => { $('#kres').textContent = 'Searching…'; try { const r = await api('/api/bitrate', 'POST', { kbps: 0 }); $('#kres').textContent = r.found ? 'Found ' + r.found + ' kbps' : 'No traffic at any rate. Key on? Wiring?'; if (r.found) $('#kb').value = String(r.found); } catch (e) { $('#kres').textContent = e.message; } pollStatus(); };
  $('#setk').onclick = async () => { try { const r = await api('/api/bitrate', 'POST', { kbps: $('#kb').value }); $('#kres').textContent = 'Set to ' + r.kbps + ' kbps'; } catch (e) { $('#kres').textContent = e.message; } pollStatus(); };
}
if (USB) { document.title = 'MavR CAN Capture (USB)'; $('.brand b').textContent = 'MavR CAN Capture · USB'; }

window.addEventListener('beforeunload', e => { if (runner) { e.preventDefault(); e.returnValue = ''; } });
refreshSaveUi(); FS.restore();
renderPlan();
</script>
</body>
</html>
